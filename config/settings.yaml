# Modular RAG MCP Server - 配置
# 这是 MCP Server 的主配置文件。
# 编辑本文件以配置 LLM、Embedding、VectorStore 以及其他服务。

# =============================================================================
# LLM 配置
# =============================================================================
llm:
  provider: "openai"  # 可选项: openai, azure, ollama, deepseek
  model: "gpt-4o"
  deployment_name: "gpt-4o"
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  api_version: "2024-02-15-preview"
  api_key: "YOUR_API_KEY_HERE"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding 配置
# =============================================================================
embedding:
  provider: "openai"  # 可选项: openai, azure, ollama
  model: "text-embedding-ada-002"
  dimensions: 1536  # text-embedding-ada-002 固定维度 (不传递给API, 仅用于验证)
  # Azure 兼容设置（azure_endpoint 会触发 Azure 兼容模式）:
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  deployment_name: "text-embedding-ada-002"
  api_version: "2024-02-15-preview"
  api_key: "YOUR_API_KEY_HERE"
  # OpenAI 专属设置（若 provider 为 openai）:
  # api_key: "YOUR_API_KEY_HERE"

# =============================================================================
# 视觉 LLM 配置（用于图像描述生成）
# =============================================================================
vision_llm:
  enabled: true  # 设为 true 以启用视觉能力
  provider: "openai"  # 可选项: openai, azure, ollama
  model: "gpt-4o"  # 可选项: gpt-4o, gpt-4-vision-preview (OpenAI), llava (Ollama)
  # Azure 兼容设置（azure_endpoint 会触发 Azure 兼容模式）:
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  deployment_name: "gpt-4o"
  api_version: "2024-02-15-preview"
  api_key: "YOUR_API_KEY_HERE"
  # Ollama 专属设置（若 provider 为 ollama）:
  # base_url: "http://localhost:11434"
  max_image_size: 2048  # 图像压缩的最大边长（宽/高）

# =============================================================================
# Vector Store 配置
# =============================================================================
vector_store:
  provider: "chroma"  # 可选项: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# 检索配置
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF 常数
  enable_dense: true         # 关闭则会跳过向量检索
  enable_sparse: true        # 关闭则会跳过 BM25 检索
  parallel_retrieval: true   # 双路并行；false 时串行执行
  metadata_filter_post: true # 融合后按 metadata 过滤

# =============================================================================
# Rerank 配置
# =============================================================================
rerank:
  enabled: false
  provider: "none"  # 可选项: none, cross_encoder, llm
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

# =============================================================================
# 评估配置
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # 可选项: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# 可观测性配置
# =============================================================================
observability:
  log_level: "INFO"  # 可选项: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# 摄取配置
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # 可选项: recursive, fixed_length, markdown, semantic, structure, propositional
  batch_size: 100

  # transform配置
  # Chunk Refiner 配置（C5）
  chunk_refiner:
    use_llm: true  # 设为 true 以启用基于 LLM 的细化（需要 LLM 配置）
    # 当 use_llm 为 false 或 LLM 调用失败时，回退到基于规则的细化
  
  # Metadata Enricher 配置（C6）
  metadata_enricher:
    use_llm: true  # 设为 true 以启用基于 LLM 的元数据增强（需要 LLM 配置）
    # 当 use_llm 为 false 或 LLM 调用失败时，回退到基于规则的增强
